<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Киберглаз — Управление ESP32</title>
    <style>
        body { background: #121212; color: #00ffcc; font-family: monospace; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; border: 2px solid #00ffcc; border-radius: 10px; padding: 20px; display: inline-block; margin-top: 20px; max-width: 400px; width: 100%; }
        input, button { background: #2e2e2e; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; margin: 10px; cursor: pointer; font-family: monospace; border-radius: 5px; width: 80%; }
        button:hover { background: #00ffcc; color: #121212; }
        #status { margin-top: 15px; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>
    <h1>КИБЕРГЛАЗ</h1>
    <div class="card">
        <p>Выберите изображение (128x64) для отправки на дисплей:</p>
        <input type="file" id="imageInput" accept="image/*"><br>
        <button onclick="processAndSendImage()">Отправить кадр</button>
        <div id="status">Статус: Готов к работе</div>
    </div>

    <script>
        function processAndSendImage() {
            const fileInput = document.getElementById('imageInput');
            const statusDiv = document.getElementById('status');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Ошибка: Выберите файл картинки!";
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.drawImage(img, 0, 0, 128, 64);
                    const imgData = ctx.getImageData(0, 0, 128, 64);
                    const pixels = imgData.data;

                    let buffer = new Uint8Array(1024);
                    for (let y = 0; y < 64; y++) {
                        for (let x = 0; x < 128; x++) {
                            let idx = (y * 128 + x) * 4;
                            let avg = (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;

                            if (avg > 127) {
                                let byteIndex = y * (128 / 8) + Math.floor(x / 8);
                                let bitIndex = 7 - (x % 8);
                                buffer[byteIndex] |= (1 << bitIndex);
                            }
                        }
                    }

                    let packet = new Uint8Array(4 + buffer.length);
                    packet.set([75, 77, 71, 58], 0); // "IMG:"
                    packet.set(buffer, 4);

                    statusDiv.innerText = "Кадр готов! Размер: " + packet.length + " байт";
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
